services:
  bot:
    build: .
    env_file: .env
    depends_on:
      - rag-worker
    restart: unless-stopped

  rag-worker:
    build:
      context: .
      dockerfile: Dockerfile.rag
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      AUTO_INDEX: "1"
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
